<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>API Tester</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="popup-body">
<div class="popup">
  <div class="popup-brand">
    <img src="../icons/icon32.png" alt="" width="20" height="20" />
    <span>API Tester</span>
  </div>
  <button id="open-tab" class="popup-btn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
      <path d="M3 9h18"></path>
    </svg>
    <span>
      <strong>Full screen</strong>
      <small>Open in a new tab</small>
    </span>
  </button>
  <button id="open-sidebar" class="popup-btn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
      <path d="M15 4v16"></path>
    </svg>
    <span>
      <strong>Sidebar</strong>
      <small>Open in the side panel</small>
    </span>
  </button>
</div>
<script src="popup.js"></script>
</body>
</html>
